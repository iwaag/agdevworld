[project]
name = "agentroom"
version = "0.1.0"
description = "Live Zulip read for agdevworld's agent room view"
requires-python = ">=3.11"
dependencies = ["pyagag"]

[project.scripts]
agentroom = "agentroom.main:main"

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentroom"]
