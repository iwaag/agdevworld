[project]
name = "agentroom"
version = "0.1.0"
description = "What this host says about harness usage, for the workflow editor's Usage view"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentroom = "agentroom.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentroom"]
