[project]
name = "agdevworld-assistant"
version = "0.1.0"
description = "Stateless profile-selected front service and bounded MCP tool bridge for agdevworld."
requires-python = ">=3.11"
dependencies = [
    "pyagag",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agdevworld_assistant"]

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests_py"]
