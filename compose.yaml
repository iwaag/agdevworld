services:
  # Production-style: build the static bundle, serve via nginx
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8090:80"
      # The agdev origin with the /wfe/ route to the workflow editor
      # (nginx.conf), on the LAN like the service behind it.
      - "8093:8093"
    # aghangout (workflow_editor p15), a managed project's application served
    # on the agdev origin at /hangout/: its own releases, installed by its
    # own deploy into this directory (`current` names the active one). The
    # site never builds it.
    volumes:
      - ${AGHANGOUT_DIR:-../.local/agdev/hangout}:/srv/hangout:ro

  # Dev with HMR: docker compose up dev
  dev:
    image: node:26-alpine
    profiles: [dev]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  node_modules:
