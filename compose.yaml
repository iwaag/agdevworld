services:
  # Production-style: build the static bundle, serve via nginx
  web:
    build: .
    ports:
      - "8090:80"

  # Server-side chat assistant: browser -> (nginx|vite proxy) -> assistant -> ollama
  assistant:
    build: ./assistant
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-4.7-flash:latest}
      AGFORGE_URL: ${AGFORGE_URL:-http://host.docker.internal:8092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"

  # Dev with HMR: docker compose up dev
  dev:
    image: node:26-alpine
    profiles: [dev]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  node_modules:
