services:
  # Production-style: build the static bundle, serve via nginx
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8090:80"

  # One fresh profile-selected front run per browser chat request.
  assistant:
    build:
      context: .
      dockerfile: assistant/Dockerfile
    restart: unless-stopped
    environment:
      AGDEVWORLD_TOOL_BASE_URL: http://web
      AGFORGE_URL: ${AGFORGE_URL:-http://host.docker.internal:8092}
      AGENT_PROVIDER_OLLAMA_BASE_URL: ${AGENT_PROVIDER_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      AGENT_FRONT_PROFILE: ${AGENT_FRONT_PROFILE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # "<name>=<url>,..."; unset falls back to the local node only, so real
      # cluster hostnames stay out of the repo.
      AUTOLAB_NODES: ${AUTOLAB_NODES:-}
      PLANE_URL: ${PLANE_URL:-}
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID:-}
      # Records outlive the container. Without this the store is the container
      # log, which `up --build` destroys — and a note an agent leaves about a
      # wrong fact is worth nothing if the next rebuild erases it.
      ASSISTANT_RECORDS_DIR: /records
    volumes:
      - assistant_records:/records
      - ../.local/zulip/devworld-assistant.env:/run/secrets/zulip.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"

  # Dev with HMR: docker compose up dev
  dev:
    image: node:26-alpine
    profiles: [dev]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  node_modules:
  assistant_records:
