server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://assistant:8091;
        # Slightly outlast the assistant's 300 s chat bound so the client
        # receives the assistant's explicit timeout record and 502 response.
        # Every other route's own upstream timeout (<= 130 s) fits under it.
        proxy_read_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
