server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The agdev origin (workflow_editor p4). The same static site, plus /wfe/:
# a same-origin route to the workflow editor service on the host. Both are
# on the LAN (compose.yaml publishes this port on every interface). The
# request's own Host is passed on, so the editor's same-origin write check
# holds under whatever name the page was opened with. The editor marks routed
# requests (x-wfe-route) and refuses there any operation that takes a host
# path or a repository location.
server {
    listen 8093;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /wfe/ {
        proxy_pass http://host.docker.internal:8098/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header x-wfe-route agdevworld;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
