server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The temporary python_backend split (phase 2 of that episode, deleted in
    # phase 3): the three ported paths are served by the Python service, every
    # other /api/ path still by the JavaScript one. An exact-match location
    # wins over a prefix in nginx, so order here is documentation, not logic.
    location = /api/chat {
        proxy_pass http://assistant-py:8093;
        # Slightly outlast the assistant's 300 s process bound so the client
        # receives the assistant's explicit timeout record and 502 response.
        proxy_read_timeout 310s;
    }

    location = /api/guide {
        proxy_pass http://assistant-py:8093;
    }

    location = /api/note {
        proxy_pass http://assistant-py:8093;
    }

    location /api/ {
        proxy_pass http://assistant:8091;
        proxy_read_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
