server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Chat requests go to the compose `assistant` service.
    location /api/ {
        proxy_pass http://assistant:8091;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
