# The agdev origin (:8093) and the site's first listener (:8090). Since
# workflow_editor p15 agdevworld serves no screen of its own:
#
# - /wfe/     Home, the agdev dashboard: the workflow editor service on the
#             host (same origin, so its pages write to its API);
# - /hangout/ aghangout, a managed project's application for talking with
#             the project agents: its own release, mounted read-only
#             (compose.yaml), served on this origin so its writes to
#             /wfe/api are same-origin. A redeploy of aghangout needs no
#             rebuild here.
#
# Old Front Desk links (`/?view=frontdesk&conv=<id>`, e.g. in Slack threads)
# open that conversation in aghangout; every other address goes Home.

# The first listener has no routes of its own: it sends people to the agdev
# origin on the same host.
server {
    listen 80;
    location / {
        if ($arg_view = "frontdesk") { return 302 $scheme://$host:8093/hangout/?conv=$arg_conv; }
        return 302 $scheme://$host:8093/wfe/;
    }
}

server {
    listen 8093;
    absolute_redirect off;

    location / {
        if ($arg_view = "frontdesk") { return 302 /hangout/?conv=$arg_conv; }
        return 302 /wfe/;
    }

    location = /hangout { return 302 /hangout/$is_args$args; }
    location /hangout/ {
        alias /srv/hangout/current/;
        index index.html;
        # Browsers revalidate, so a new release shows on reload.
        add_header Cache-Control "no-cache";
    }

    # Requests carry the browser's own Host, so the service's same-origin
    # write check holds under whatever name the page was opened with; routed
    # requests carry x-wfe-route (the service gates nothing on it since
    # workflow_editor p11). Redirects stay relative.
    location /wfe/ {
        proxy_pass http://host.docker.internal:8098/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header x-wfe-route agdevworld;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Challenge writes carry their files (challenge p3): one write adds
        # at most 64 MiB, base64 in JSON (~86 MiB; the service refuses more,
        # docs/challenges.md *Limits*).
        client_max_body_size 100m;
    }
}
