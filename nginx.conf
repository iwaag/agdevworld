server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # python_backend phase 3, step 3: every /api/ path the UI reaches is
    # served by the Python service. The JavaScript service below stays up one
    # more step as the rollback path only; step 4 collapses this back to a
    # single /api/ location.
    location = /api/chat {
        proxy_pass http://assistant-py:8093;
        # Slightly outlast the assistant's 300 s process bound so the client
        # receives the assistant's explicit timeout record and 502 response.
        proxy_read_timeout 310s;
    }

    location = /api/guide {
        proxy_pass http://assistant-py:8093;
    }

    location = /api/note {
        proxy_pass http://assistant-py:8093;
    }

    location /api/forge/ {
        proxy_pass http://assistant-py:8093;
        # forge answers in 20-105 s; the service's own upstream bound is 120 s.
        proxy_read_timeout 130s;
    }

    location /api/freeforge/ {
        proxy_pass http://assistant-py:8093;
        proxy_read_timeout 90s;
    }

    location /api/autolab/ {
        proxy_pass http://assistant-py:8093;
        # A node window POST can hold 60 s, and a project start makes several
        # 30-60 s bounded provisioning calls in sequence.
        proxy_read_timeout 130s;
    }

    location /api/plane/ {
        proxy_pass http://assistant-py:8093;
        proxy_read_timeout 90s;
    }

    location /api/ {
        proxy_pass http://assistant:8091;
        proxy_read_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
