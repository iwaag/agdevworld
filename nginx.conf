# Home is the agdev dashboard, served by the workflow editor service under
# /wfe/ on the agdev origin (retire_old_ui p1). This static site keeps one
# screen of its own, the Front Desk (`/?view=frontdesk[&conv=<id>]`, also
# the Arguing Room `/?view=argue`): a request for `/` with a query is that
# screen and is answered as before, so the conversation links Slack posts
# keep opening; `/` without one goes Home. Any other query the bundle sends
# Home itself (src/main.ts).

# The site's first listener (:8090) has no /wfe/ route: Home is the agdev
# origin on the same host the request named.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        if ($args = "") { return 302 $scheme://$host:8093/wfe/; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The agdev origin (workflow_editor p4). The same static site, plus /wfe/:
# a same-origin route to the workflow editor service on the host. Both are
# on the LAN (compose.yaml publishes this port on every interface). The
# request's own Host is passed on, so the editor's same-origin write check
# holds under whatever name the page was opened with. Routed requests carry
# x-wfe-route; since workflow_editor p11 the service gates nothing on it.
# Redirects stay relative, so Home keeps the port the browser used.
server {
    listen 8093;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / {
        if ($args = "") { return 302 /wfe/; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /wfe/ {
        proxy_pass http://host.docker.internal:8098/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header x-wfe-route agdevworld;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
