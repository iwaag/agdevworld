server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The agdev origin (workflow_editor p4). The same static site, plus /wfe/:
# a same-origin route to the workflow editor service, which itself listens
# on the host's loopback only. compose.yaml publishes this port on
# 127.0.0.1 only, so the route reaches as far as the service does and no
# further. The editor marks routed requests (x-wfe-route) and refuses there
# any operation that takes a host path or a repository location.
server {
    listen 8093;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /wfe/ {
        proxy_pass http://host.docker.internal:8098/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header x-wfe-route agdevworld;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
